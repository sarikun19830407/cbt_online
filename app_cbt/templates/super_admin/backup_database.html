{% extends "base.html" %}

{% block konten %}
<div class="container ">
    <!-- Header -->

    <!-- Card Download -->
    <div class="row justify-content-center mt-3">
        <div class="col-lg-8">
            <div class="card shadow border-0 rounded-3">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-database me-2"></i> Download Backup Data
                    </h5>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ link }}">
                        {% csrf_token %}

                        <div class="mb-3">

                            {{ form }}

                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="bi bi-download me-2"></i> Download Backup
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .form-select {
        padding: 0.75rem;
        border-radius: 0.5rem;
    }
</style>
{% endblock %}
