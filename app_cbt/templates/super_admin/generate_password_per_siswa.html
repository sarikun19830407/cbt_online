{% extends 'base.html' %}

<body>
    {% block konten %}
    <div class="container card bg-gradient">
        <section class="py-5 ">
            <div class="container card-body ">
                <h3 class="text-center mb-1">Apkah Anda yakin inggin mengenret ulang password {{siswa_count}} siswa ?
                </h3>
                <div class="row justify-content-center">
                    <div class="col-md-6">
                        <hr>
                        <form method="POST" action="{% url 'cbt:generate_password_persiswa' siswa.id %}">
                            {% csrf_token %}
                            <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                                <button class="btn btn-primary me-md-2 bi bi-trash" type="submit" name="confirm"
                                    value="yes">&nbsp;Ya</button>
                                <a class="btn btn-secondary bi bi-arrow-clockwise" href="{{link}}">&nbsp;Batal</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </div>
    {% endblock %}
</body>
