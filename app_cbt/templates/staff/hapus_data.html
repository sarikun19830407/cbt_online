{% extends 'base.html' %}

<body>
    {% block konten %}
    <div class="container">
        <div class="card shadow-lg">
            <div class="card-body">
                <section class="py-5 bg-light">
                    <div class="container">
                        <h3 class="text-center mb-1">Apkah Anda yakin inggin menghapus <strong>{{Hapus}}</strong> ?</h3>
                        <div class="row justify-content-center">
                            <div class="col-md-6">
                                <hr>
                                <form method="POST" action="{{hapus}}">
                                    {% csrf_token %}
                                    {% for Data in Data %}
                                    <input type="hidden" name="selected_ids" value="{{ Data.id }}">
                                    {% endfor %}
                                    <br>
                                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                                        <button class="btn btn-primary me-md-2 bi bi-trash" type="submit" name="confirm"
                                            value="yes">&nbsp;Ya</button>
                                        <a class="btn btn-secondary bi bi-arrow-clockwise"
                                            href="{{link}}">&nbsp;Batal</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

        </div>
    </div>
    {% endblock %}
</body>
