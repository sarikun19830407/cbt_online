{% load static %}

<script src="{% static 'poper.js' %}"></script>
<script src="{% static 'pesan.js' %}"></script>
<script src="{% static 'matematic/MathJax.js' %}?config=TeX-AMS_HTML" defer></script>

{% for message in messages %}
<script>
    Swal.fire({
        title: "{{ message.tags|capfirst }}",
        text: "{{ message|escapejs }}",
        icon: "{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% else %}info{% endif %}",
        confirmButtonText: "OK",
        confirmButtonColor: "#3085d6",
        backdrop: true,
        allowOutsideClick: false,
        position: "center",
        didOpen: (popup) => {
            popup.style.top = "-15vh";        // geser ke atas (¼ layar)

        }
    });

</script>
{% endfor %}
